<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Status - CSPC Lab &amp; Room Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="/img/hornet-logo.jpg" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    <h1 class="page-title h4">Room availability</h1>
    <p class="text-muted-sm mb-4">
      Live timetable of pending and approved bookings. Rejected and cancelled
      requests do not occupy a room.
    </p>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-sm-3">
            <label class="form-label" for="date">Date</label>
            <input type="date" class="form-control" id="date" />
          </div>
          <div class="col-sm-4">
            <label class="form-label" for="building_id">Building</label>
            <select class="form-select" id="building_id">
              <option value="">All buildings</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label" for="room_type">Space type</label>
            <select class="form-select" id="room_type">
              <option value="">All types</option>
              <option value="laboratory">Laboratory</option>
              <option value="hall">Hall / Venue</option>
            </select>
          </div>
          <div class="col-sm-2">
            <button class="btn btn-cspc w-100" id="refresh-btn" type="button">Refresh</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4" id="summary-row">
      <div class="col-4">
        <div class="card stat-card"><div class="card-body">
          <div class="stat-value" id="sum-rooms">-</div>
          <div class="stat-label">Rooms</div>
        </div></div>
      </div>
      <div class="col-4">
        <div class="card stat-card stat-approved"><div class="card-body">
          <div class="stat-value" id="sum-free">-</div>
          <div class="stat-label">Free all day</div>
        </div></div>
      </div>
      <div class="col-4">
        <div class="card stat-card stat-pending"><div class="card-body">
          <div class="stat-value" id="sum-bookings">-</div>
          <div class="stat-label">Bookings</div>
        </div></div>
      </div>
    </div>

    <div class="row g-3" id="rooms-grid">
      <div class="col-12">
        <p class="text-muted-sm">Loading rooms...</p>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    CSPC Lab &amp; Room Reservation System &middot; Computer Studies Department
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/rooms-status.js"></script>
</body>
</html>

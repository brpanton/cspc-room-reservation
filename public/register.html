<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - CSPC Lab &amp; Room Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="/img/hornet-logo.jpg" />
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-hero">
        <img class="auth-seal" src="/img/cspc-logo.png"
             alt="Camarines Sur Polytechnic Colleges official seal" />
        <h1>Create an account</h1>
        <p>Students and faculty can self-register. Staff accounts are issued by the administrator.</p>
      </div>

      <div class="card-body p-4">
        <div id="register-alert" class="d-none" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="school_id">School ID number</label>
            <input type="text" class="form-control" id="school_id" name="school_id"
                   placeholder="e.g. 2021-00123 or FAC-0100" required />
            <div class="form-text">Letters, digits and dashes only (4-50 characters).</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="full_name">Full name</label>
            <input type="text" class="form-control" id="full_name" name="full_name"
                   placeholder="e.g. Juan Dela Cruz" required />
          </div>

          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@cspc.edu.ph" required />
          </div>

          <div class="row">
            <div class="col-sm-6 mb-3">
              <label class="form-label" for="role">I am a</label>
              <select class="form-select" id="role" name="role" required>
                <option value="student" selected>Student</option>
                <option value="faculty">Faculty</option>
              </select>
            </div>
            <div class="col-sm-6 mb-3">
              <label class="form-label" for="department">Department</label>
              <input type="text" class="form-control" id="department" name="department"
                     placeholder="Optional" />
            </div>
          </div>

          <div class="row">
            <div class="col-sm-6 mb-3">
              <label class="form-label" for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="At least 8 characters" required />
            </div>
            <div class="col-sm-6 mb-3">
              <label class="form-label" for="confirm_password">Confirm password</label>
              <input type="password" class="form-control" id="confirm_password"
                     name="confirm_password" placeholder="Repeat password" required />
            </div>
          </div>

          <button type="submit" class="btn btn-cspc w-100" id="register-btn">Create account</button>
        </form>

        <p class="text-center text-muted-sm mt-3 mb-0">
          Already registered? <a href="/index.html">Log in</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    CSPC Lab &amp; Room Reservation System &middot; Computer Studies Department
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>

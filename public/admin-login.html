<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login - CSPC Lab &amp; Room Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <link rel="icon" type="image/jpeg" href="/img/hornet-logo.jpg" />
</head>
<body data-login-page="admin" class="admin-shell-page">
  <div id="navbar-placeholder" class="admin-shell-navbar"></div>

  <main class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-hero">
        <h1>Administrator Portal</h1>
        <p>Secure backend access for system administrators.</p>
      </div>

      <div class="card-body p-4">
        <div id="login-alert" class="d-none" role="alert"></div>

        <!-- One-click Google SSO sits above everything else: the fastest way in. -->
        <button type="button" class="btn btn-sso" id="sso-google">
          <svg class="sso-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign in with Google</span>
        </button>

        <div class="auth-divider" aria-hidden="true"><span>or</span></div>

        <div class="auth-mode-banner mt-3 admin-mode" id="auth-mode-banner">
          <span class="admin-portal-badge">Administrator Portal</span>
        </div>

        <div class="admin-page-only-note">
          Secure access for authorized administrators only.
        </div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="school_id" id="school_id_label">Email address</label>
            <input type="email" class="form-control" id="school_id" name="email"
                   placeholder="Enter your email address (e.g. name@cspc.edu.ph)" inputmode="email" autocomplete="username" required />
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Your password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-cspc w-100" id="login-btn">Login</button>
        </form>

        <div class="auth-admin-actions mt-4">
          <a href="/index.html" class="btn btn-outline-light btn-return-user">Return to User Login</a>
        </div>

        <div class="auth-support mt-4 admin-page-support" aria-label="Support links">
          <a href="#" id="forgot-password-link">Forgot password?</a>
          <span class="auth-support-sep" aria-hidden="true">&middot;</span>
          <a href="#" id="support-link">IT Support / Help desk</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="portal-footer">
    CSPC Lab &amp; Room Reservation System &middot; Computer Studies Department
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
